  <script type="module">
    function updateClock() {
      const now = new Date();

      const vienna = now.toLocaleTimeString("en-GB", {
          timeZone: "Europe/Vienna",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
      });

      document.getElementById("clock").textContent = `CET ${vienna}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
